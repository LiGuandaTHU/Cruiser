end: true

channel:
  - name: AtoB
    field:
      - fieldname: type
        fieldtype: mtype
  - name: BtoA
    field:
      - fieldname: type
        fieldtype: mtype

behavior:
  - pattern: INTERCEPTION
    channel: AtoB
    filter: NONE

  - pattern: INTERCEPTION
    channel: BtoA
    filter: NONE
  
  - pattern: INJECTION
    channel: AtoB
    assigner:
      type:
        one of:
        - const: SYN
        - const: ACK
        - const: FIN

  - pattern: INJECTION
    channel: BtoA
    assigner:
      type:
        one of:
        - const: SYN
        - const: ACK
        - const: FIN

